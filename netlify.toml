[build]
  publish = "tmp/site"
  command = "node scripts/check-build.cjs"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Provider calls have an 8 second timeout.

[[redirects]]
  from = "/api/assistant"
  to = "/.netlify/functions/assistant"
  status = 200
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/api/assistant"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
